.name{font-size:84px;font-weight:800;letter-spacing:-2px;line-height:1}
.tag{font-size:30px;font-weight:500;color:#C9C6D6;letter-spacing:-.3px;line-height:1.25;max-width:560px}
.accent{color:#9b7bff}
